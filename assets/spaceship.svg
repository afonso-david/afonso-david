<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FE0E8"/>
      <stop offset="50%" stop-color="#00C8D8"/>
      <stop offset="100%" stop-color="#0090A8"/>
    </linearGradient>
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BCEAF7"/>
      <stop offset="100%" stop-color="#3FA0C2"/>
    </linearGradient>
    <radialGradient id="flameOuter" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="55%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF5000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameInner" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFAA00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== FLAMES (behind ship) ===== -->
  <g id="flames">
    <!-- left engine flame -->
    <g transform="translate(48,210)">
      <polygon points="-13,0 13,0 0,34" fill="url(#flameOuter)">
        <animate attributeName="points"
          values="-13,0 13,0 0,34; -13,0 13,0 0,46; -13,0 13,0 0,34"
          dur="0.6s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-6,0 6,0 0,20" fill="url(#flameInner)">
        <animate attributeName="points"
          values="-6,0 6,0 0,20; -6,0 6,0 0,28; -6,0 6,0 0,20"
          dur="0.6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- center engine flame -->
    <g transform="translate(100,222)">
      <polygon points="-10,0 10,0 0,28" fill="url(#flameOuter)">
        <animate attributeName="points"
          values="-10,0 10,0 0,28; -10,0 10,0 0,40; -10,0 10,0 0,28"
          dur="0.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-5,0 5,0 0,16" fill="url(#flameInner)">
        <animate attributeName="points"
          values="-5,0 5,0 0,16; -5,0 5,0 0,24; -5,0 5,0 0,16"
          dur="0.5s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- right engine flame -->
    <g transform="translate(152,210)">
      <polygon points="-13,0 13,0 0,34" fill="url(#flameOuter)">
        <animate attributeName="points"
          values="-13,0 13,0 0,34; -13,0 13,0 0,46; -13,0 13,0 0,34"
          dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="-6,0 6,0 0,20" fill="url(#flameInner)">
        <animate attributeName="points"
          values="-6,0 6,0 0,20; -6,0 6,0 0,28; -6,0 6,0 0,20"
          dur="0.6s" begin="0.3s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- ===== LANDING LEGS ===== -->
  <g id="legs">
    <!-- left leg -->
    <rect x="38" y="185" width="20" height="30" fill="#D99A1F"/>
    <rect x="42" y="188" width="12" height="22" fill="#FF7A00"/>
    <!-- center leg -->
    <rect x="92" y="195" width="16" height="30" fill="#8A6A24"/>
    <!-- right leg -->
    <rect x="142" y="185" width="20" height="30" fill="#D99A1F"/>
    <rect x="146" y="188" width="12" height="22" fill="#FF7A00"/>
  </g>

  <!-- ===== WINGS / ARMS ===== -->
  <g id="wings">
    <!-- left wing -->
    <polygon points="2,160 56,128 56,200 16,200 16,180 2,180" fill="#003F5C"/>
    <polygon points="2,160 16,160 16,174 2,174" fill="#0FE0E8"/>
    <rect x="20" y="172" width="22" height="7" fill="#FF2E9A"/>
    <rect x="20" y="182" width="22" height="7" fill="#FF2E9A"/>

    <!-- right wing -->
    <polygon points="198,160 144,128 144,200 184,200 184,180 198,180" fill="#003F5C"/>
    <polygon points="198,160 184,160 184,174 198,174" fill="#0FE0E8"/>
    <rect x="158" y="172" width="22" height="7" fill="#FF2E9A"/>
    <rect x="158" y="182" width="22" height="7" fill="#FF2E9A"/>
  </g>

  <!-- ===== MAIN HULL ===== -->
  <g id="hull">
    <!-- lower hull skirt -->
    <rect x="58" y="178" width="84" height="22" fill="#003F5C"/>
    <!-- hip accent stripes -->
    <rect x="68" y="186" width="16" height="22" fill="#FF2E9A"/>
    <rect x="92" y="186" width="16" height="34" fill="#FF2E9A"/>
    <rect x="116" y="186" width="16" height="22" fill="#FF2E9A"/>

    <!-- main body: blocky silhouette, narrower at the nose, wider at the base -->
    <polygon points="92,38 108,38 112,70 124,90 124,178 76,178 76,90 88,70" fill="url(#hullGrad)"/>
    <!-- center highlight stripe -->
    <rect x="96" y="70" width="8" height="108" fill="#7FF1F8" opacity="0.55"/>

    <!-- shoulder pads -->
    <polygon points="76,90 56,100 56,128 70,128 76,108" fill="#003F5C"/>
    <polygon points="124,90 144,100 144,128 130,128 124,108" fill="#003F5C"/>
    <rect x="58" y="102" width="10" height="22" fill="#0FE0E8"/>
    <rect x="132" y="102" width="10" height="22" fill="#0FE0E8"/>
  </g>

  <!-- ===== COCKPIT ===== -->
  <g id="cockpit">
    <polygon points="92,38 108,38 112,68 88,68" fill="#00688A"/>
    <rect x="86" y="42" width="28" height="28" rx="2" fill="url(#cockpitGrad)"/>
    <rect x="89" y="45" width="8" height="10" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- ===== NOSE TIP ===== -->
  <polygon points="100,4 109,16 109,38 91,38 91,16" fill="#E7F3F7"/>
  <polygon points="100,4 105,16 105,38 95,38 95,16" fill="#FFFFFF"/>
</svg>
